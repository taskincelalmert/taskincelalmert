name: Update language chart

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate chart
        env:
          # LANG_STATS_TOKEN must be a fine-grained PAT with read access to
          # all repos; the default github.token only sees public repos and
          # would overwrite the chart with incomplete stats.
          GH_TOKEN: ${{ secrets.LANG_STATS_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "LANG_STATS_TOKEN secret not set; skipping to keep private-repo stats"
            exit 0
          fi
          python3 scripts/generate_lang_chart.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/top-langs.svg
          git diff --cached --quiet || (git commit -m "chore: update language chart" && git push)
