name: Update README charts

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The scripts declare fonttools inline; uv installs it on the fly.
      - uses: astral-sh/setup-uv@v6

      - name: Generate language chart
        env:
          # LANG_STATS_TOKEN must be a fine-grained PAT with read access to
          # all repos; the default github.token only sees public repos and
          # would overwrite the chart with incomplete stats.
          GH_TOKEN: ${{ secrets.LANG_STATS_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "LANG_STATS_TOKEN secret not set; skipping to keep private-repo stats"
            exit 0
          fi
          uv run scripts/generate_lang_chart.py

      # Reads the public contribution calendar, so no secret is required.
      - name: Generate activity chart
        run: uv run scripts/generate_activity_chart.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stack-light.svg assets/stack-dark.svg assets/activity-light.svg assets/activity-dark.svg
          git diff --cached --quiet || (git commit -m "chore: update readme charts" && git push)
